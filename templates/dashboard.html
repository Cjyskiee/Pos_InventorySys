<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Dashboard</title>
        <meta name="description" content="Dashboard Inventory System">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>  
        <header class="topbar">
            <h1 style="margin-left: 4%; font-size: xx-large;"><strong>Stock Inventory</strong></h1>
            <h2 style="margin-right: 15%; font-size: xx-large"><strong>Dashboard</strong></h2>
            <nav>
                <div class="Add-outline">
                    <a href="{{ url_for('AddItems')}}"><h3>+ Add Item</h3></a>
                </div>
            </nav>  
        </header>

    <div class="grid-container">
        <div class="box">
            <h3 style="color: gray;">Total Items</h3>
            <p><h1 style="font-size: xx-large;">{{ ALL_ITEMS }}</h1></p>
        </div>

        <div class="box">
            <h3 style="color: gray;">Inventory Value</h3>
            <p><h1 style="font-size: xx-large;">₱{{ SUM_TOTALVALUE }}</h1></p>
        </div>
        <div class="box" style="background-color: rgb(243, 176, 176); border-color: aliceblue;">
            <h3 style="color: gray;">Low Stock</h3>
            <p><h1 style="font-size: xx-large;">{{ SUM_LOWSTOCK }}</h1></p>
        </div>
        <div class="box">
            <h3 style="color: gray;">Categories</h3>
            <p><h1 style="font-size: xx-large;">{{ ALL_CATEGORIES }}</h1></p>
        </div>

        <a href="/View_All">
            <div class="box">
                <h3 style="color: skyblue; font-size: 7mm; padding-top: -4mm; ">⫶☰</h3>
                <h2 style="text-align: left; padding-bottom: 7mm;">View all Items</h2>
            </div>
        </a>

        <a href="/Items_Reorder">
            <div class="box">
                <h3 style="color: rgb(15, 15, 15); font-size: 7mm; padding-top: -4mm; ">⚠️</h3>
                <h2 style="text-align: left; padding-bottom: 7mm;">Low stock reports</h2>
            </div>
        </a>

    </div>

    
    </body>
</html>
